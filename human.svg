<text x="78" y="110" font-family="Arial" font-size="65" font-weight="800" fill="#52d4ff" filter="url(#glow)">STATION 2 — HUMAN BODY</text>
<text x="79" y="165" font-family="Arial" font-size="30" fill="#c7d0de">How does space affect the human body?</text>
<text x="1085" y="116" text-anchor="middle" font-family="Arial" font-size="82" fill="#52d4ff">🧑‍🚀</text>
<line x1="80" y1="195" x2="1120" y2="195" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>
<text x="90" y="255" font-family="Arial" font-size="38" fill="#f4f7fb"><tspan fill="#52d4ff" font-size="30">●</tspan> Low gravity changes how muscles and bones are used.</text><text x="90" y="323" font-family="Arial" font-size="38" fill="#f4f7fb"><tspan fill="#52d4ff" font-size="30">●</tspan> Astronauts exercise to reduce physical decline.</text><text x="90" y="391" font-family="Arial" font-size="38" fill="#f4f7fb"><tspan fill="#52d4ff" font-size="30">●</tspan> Long missions require continuous health monitoring.</text>
<text x="600" y="585" text-anchor="middle" font-family="Arial" font-size="26" fill="#9ba7bb">Biology focus: muscles, bones, circulation and adaptation</text>
