<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#07111c"/><stop offset="1" stop-color="#0a0d18"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="650" rx="34" fill="url(#bg)"/>
<rect x="10" y="10" width="1180" height="630" rx="30" fill="none" stroke="#d86cff" stroke-width="5"/>
<text x="78" y="110" font-family="Arial" font-size="65" font-weight="800" fill="#d86cff" filter="url(#glow)">STATION 3 — MICROBES</text>
<text x="79" y="165" font-family="Arial" font-size="30" fill="#c7d0de">Why study microorganisms in space?</text>
<text x="1085" y="116" text-anchor="middle" font-family="Arial" font-size="82" fill="#d86cff">🦠</text>
<line x1="80" y1="195" x2="1120" y2="195" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>
<text x="90" y="255" font-family="Arial" font-size="38" fill="#f4f7fb"><tspan fill="#d86cff" font-size="30">●</tspan> Microbes can behave differently in space conditions.</text><text x="90" y="323" font-family="Arial" font-size="38" fill="#f4f7fb"><tspan fill="#d86cff" font-size="30">●</tspan> Scientists study them to protect crews and equipment.</text><text x="90" y="391" font-family="Arial" font-size="38" fill="#f4f7fb"><tspan fill="#d86cff" font-size="30">●</tspan> Useful microbes may help recycle waste and nutrients.</text>
<text x="600" y="585" text-anchor="middle" font-family="Arial" font-size="26" fill="#9ba7bb">Biology focus: microorganisms and closed ecosystems</text>
</svg>